name: mindtrace_tests

services:

  minio:
    image: rustfs/rustfs:1.0.0
    ports:
      # Host 19000 avoids colliding with a local S3 service on 9000.
      # In-container listen stays 9000/9001.
      - "19000:9000"
      - "19001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:latest
    ports:
      - "6380:6380"
      - "7999:7999"
    command: redis-server --save "" --appendonly no --stop-writes-on-bgsave-error no --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_test_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5673:5672"   # AMQP port
      - "15673:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=test_db
    volumes:
      - mongodb_test_data:/data/db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Second MongoDB for cross-datalake replication / federation-style integration tests.
  mongodb_secondary:
    image: mongo:latest
    ports:
      - "27019:27017"
    environment:
      - MONGO_INITDB_DATABASE=test_db
    volumes:
      - mongodb_secondary_test_data:/data/db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  pypylon-runtime:
    profiles:
      - pypylon
    build:
      context: ..
      dockerfile: tests/docker/pypylon-runtime.Dockerfile
    ports:
      - "8765:8765"  # Expose pypylon service port
    volumes:
      - ..:/workspace:ro  # Read-only workspace mount
    environment:
      - PYTHONPATH=/workspace
      - PYPYLON_SERVICE_MODE=true
      - PYPYLON_AVAILABLE=true
    command: python3 -m tests.utils.pypylon.service
    healthcheck:
      test: ["CMD", "python3", "-c", "from pypylon import pylon, genicam; factory = pylon.TlFactory.GetInstance(); print('Pylon SDK OK')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  minio_data:
  mongodb_test_data:
  mongodb_secondary_test_data:
  redis_test_data: 
