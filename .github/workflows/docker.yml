name: Docker

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - uv.lock
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  image:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      context: .
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/mindtrace/mindtrace
      # pep440 tags final releases as latest too, but not pre-releases.
      meta-tags: |
        type=pep440,pattern={{version}}
        type=ref,event=pr
      set-meta-labels: true
      set-meta-annotations: true
      sbom: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
