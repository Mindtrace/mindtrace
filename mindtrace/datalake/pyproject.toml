[project]
name = "mindtrace-datalake"
version = "0.14.1.dev0"
description = "Datalake functionality for Mindtrace"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Mindtrace Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mindtrace-core>=0.14.1.dev0",
    "mindtrace-registry>=0.14.1.dev0",
    "mindtrace-database>=0.14.1.dev0",
    "mindtrace-services>=0.14.1.dev0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
import-flowers102 = [
    "scipy>=1.11.0",
    "torchvision>=0.15.0",
]
export-huggingface = [
    "datasets>=2.19.0",
]
dataloaders = [
    "datasets>=2.19.0",
    "torch>=2.0",
    "torchvision>=0.15.0",
]
export-all = [
    "datasets>=2.19.0",
]

[project.scripts]
mindtrace-datalake-import-flowers102 = "mindtrace.datalake.importers.flowers102:main"
mindtrace-datalake-import-pascal-voc = "mindtrace.datalake.importers.pascal_voc:main"
mindtrace-datalake-import-penn-fudan = "mindtrace.datalake.importers.penn_fudan:main"

[project.entry-points."mindtrace.benchmark_suites"]
datalake = "mindtrace.datalake.testing:register_benchmark_suites"

[project.urls]
Homepage = "https://mindtrace.ai"
Repository = "https://github.com/mindtrace/mindtrace/blob/main/mindtrace/datalake"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
