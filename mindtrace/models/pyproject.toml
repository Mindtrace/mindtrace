[project]
name = "mindtrace-models"
version = "0.14.1.dev0"
description = "Models for Mindtrace"
license = "Apache-2.0"
authors = [
    {name = "Mindtrace Team"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dill>=0.4.0",
    "mindtrace-core>=0.14.1.dev0",
    "mindtrace-registry>=0.14.1.dev0",
    "mindtrace-services>=0.14.1.dev0",
    "numpy>=2.3.1",
    "pydantic>=2.0",
    "torch>=2.0",
    "tensorboard>=2.14",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
# Experiment tracking backends
mlflow = ["mlflow>=2.0"]
wandb  = ["wandb>=0.16"]

# Training extras
train = ["torchvision>=0.15", "optuna>=4.8.0"]

# Architecture extras
timm         = ["timm>=0.9"]
transformers = ["transformers>=4.35"]

# Model format extras
onnx = ["onnxruntime>=1.16", "onnx>=1.14"]
peft = ["peft>=0.6"]

# Edge optimization extras
edge       = ["onnxruntime>=1.16", "onnx>=1.14", "onnxsim>=0.4.36", "onnxscript>=0.7"]
pruning    = ["torch-pruning>=1.4"]
openvino   = ["openvino>=2024.4"]
executorch = ["executorch>=1.0"]

# GPU inference extra (opt-in; deliberately NOT in `all` and NOT forwarded as a
# root workspace extra, so `uv sync --all-extras` never enables it).
#
# edge-gpu is the CUDA counterpart of `edge`. onnxruntime-gpu and onnxruntime are
# mutually exclusive (both provide the `onnxruntime` import), so this is a SEPARATE
# extra — install it INSTEAD OF `edge`, not alongside it:
#   uv pip install "mindtrace-models[edge-gpu]"
#
# TensorRT is intentionally NOT an extra: its pip package is sdist-only without
# NVIDIA's package index, which would force a heavy build into every lock
# resolution. Install it directly on a CUDA workstation (`uv pip install tensorrt`);
# on Jetson it ships with JetPack. See README for details.
edge-gpu   = ["onnxruntime-gpu>=1.16", "onnx>=1.14", "onnxsim>=0.4.36", "onnxscript>=0.7"]

# Install everything
all = [
    "mlflow>=2.0",
    "wandb>=0.16",
    "torchvision>=0.15",
    "optuna>=4.8.0",
    "timm>=0.9",
    "transformers>=4.35",
    "onnxruntime>=1.16",
    "onnx>=1.14",
    "onnxsim>=0.4.36",
    "onnxscript>=0.7",
    "torch-pruning>=1.4",
    "openvino>=2024.4",
    "executorch>=1.0",
    "peft>=0.6",
]

[project.urls]
Homepage = "https://mindtrace.ai"
Repository = "https://github.com/mindtrace/mindtrace/blob/main/mindtrace/models"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
